<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <!-- day headers -->
  <g fill="#333" text-anchor="middle" font-weight="bold">
    <text x="165" y="34">Mon</text><text x="235" y="34">Tue</text><text x="305" y="34">Wed</text>
    <text x="375" y="34">Thu</text><text x="445" y="34">Fri</text><text x="515" y="34">Sat</text>
    <text x="585" y="34">Sun</text>
  </g>
  <!-- row separators -->
  <g stroke="#D8D8D8" stroke-width="1">
    <line x1="20" y1="52" x2="620" y2="52"/><line x1="20" y1="88" x2="620" y2="88"/>
    <line x1="20" y1="124" x2="620" y2="124"/><line x1="20" y1="160" x2="620" y2="160"/>
    <line x1="20" y1="196" x2="620" y2="196"/>
  </g>
  <!-- names -->
  <g fill="#333">
    <text x="24" y="75">Amira</text><text x="24" y="111">Ben</text><text x="24" y="147">Chloe</text>
    <text x="24" y="183">Dev</text><text x="24" y="219">Ellen</text>
  </g>
  <!-- one dot per person per day they signed in -->
  <g fill="#004986">
    <circle cx="165" cy="70" r="9"/><circle cx="235" cy="70" r="9"/><circle cx="305" cy="70" r="9"/><circle cx="375" cy="70" r="9"/><circle cx="445" cy="70" r="9"/>
    <circle cx="165" cy="106" r="9"/><circle cx="375" cy="106" r="9"/>
    <circle cx="235" cy="142" r="9"/>
    <circle cx="305" cy="178" r="9"/><circle cx="515" cy="178" r="9"/>
    <circle cx="445" cy="214" r="9"/><circle cx="585" cy="214" r="9"/>
  </g>
  <line x1="20" y1="238" x2="620" y2="238" stroke="#333" stroke-width="1.5"/>
  <!-- daily unique users -->
  <text x="24" y="267" fill="#333" font-weight="bold">People that day</text>
  <g fill="#004986" text-anchor="middle" font-weight="bold">
    <text x="165" y="267">2</text><text x="235" y="267">2</text><text x="305" y="267">2</text>
    <text x="375" y="267">2</text><text x="445" y="267">2</text><text x="515" y="267">1</text>
    <text x="585" y="267">1</text>
  </g>
  <text x="24" y="305" fill="#333">Add up the daily figures: <tspan fill="#AB2328" font-weight="bold">12</tspan>.   Count the names on the left: <tspan fill="#115740" font-weight="bold">5</tspan>.</text>
</svg>
