width="8" height="12"/><rect x="490" y="194" width="8" height="12"/><rect x="500" y="194" width="8" height="12"/><rect x="510" y="194" width="8" height="12"/><rect x="520" y="194" width="8" height="12"/><rect x="530" y="194" width="8" height="12"/><rect x="540" y="194" width="8" height="12"/><rect x="550" y="194" width="8" height="12"/><rect x="560" y="194" width="8" height="12"/><rect x="570" y="194" width="8" height="12"/><rect x="580" y="194" width="8" height="12"/><rect x="590" y="194" width="8" height="12"/>
