  <text x="40" y="238" fill="#333">One figure per calendar month, kept forever</text>
  <g fill="#115740">
    <rect x="40" y="244" width="66" height="12"/><rect x="110" y="244" width="66" height="12"/><rect x="180" y="244" width="66" height="12"/><rect x="250" y="244" width="66" height="12"/><rect x="320" y="244" width="66" height="12"/><rect x="390" y="244" width="66" height="12"/><rect x="460" y="244" width="66" height="12"/><rect x="530" y="244" width="68" height="12"/>
  </g>

  <text x="40" y="288" fill="#333">A window nobody asked for in advance, for example April 22 to June 30</text>
  <rect x="200" y="294" width="200" height="12" fill="none" stroke="#AB2328" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="410" y="305" fill="#AB2328" font-weight="bold">not stored, and cannot be rebuilt</text>
