<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <!-- what IBM Verify holds -->
  <text x="40" y="22" fill="#333" font-weight="bold" font-size="15">What IBM Verify holds</text>
  <rect x="40" y="52" width="380" height="28" fill="#D8D8D8"/>
  <rect x="420" y="52" width="180" height="28" fill="#CCDAE6" stroke="#004986" stroke-width="2"/>
  <text x="230" y="44" text-anchor="middle" fill="#666">Older than 90 days: who signed in is deleted</text>
  <text x="510" y="98" text-anchor="middle" fill="#004986" font-weight="bold">Last 90 days:</text>
  <text x="510" y="114" text-anchor="middle" fill="#004986" font-weight="bold">still knows who signed in</text>
  <text x="600" y="138" text-anchor="end" fill="#333">Today</text>
  <line x1="600" y1="48" x2="600" y2="130" stroke="#333" stroke-width="1.5"/>

  <!-- what the warehouse keeps -->
  <text x="40" y="160" fill="#333" font-weight="bold" font-size="15">What our data warehouse keeps (numbers only, never names)</text>

  <text x="40" y="188" fill="#333">One figure per day, kept forever</text>
  <g fill="#004986">
