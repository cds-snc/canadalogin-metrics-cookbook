---
project:
  type: website
  output-dir: _book
  # Source subfolders hold one page per metric or table. The catalog template
  # is excluded; draft pages are left out of the build by Quarto itself.
  render:
    - "*.qmd"
    - "cookbook/*.qmd"
    - "cookbook/*/*.qmd"
    - "catalog/*.qmd"
    - "catalog/*/*.qmd"
    - "!catalog/data-catalog-template.qmd"

website:
  title: "CanadaLogin Metrics Cookbook"
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - index.qmd
      - section: "Metrics Cookbook"
        href: cookbook/index.qmd
        contents:
          - section: "IBM Verify"
            href: cookbook/ibm_verify.qmd
            contents:
              - section: "CanadaLogin"
                contents:
                  - cookbook/ibm_verify/sign-ins.qmd
                  - cookbook/ibm_verify/sign-in-success-rate.qmd
                  - cookbook/ibm_verify/completed-sign-in-sessions.qmd
                  - cookbook/ibm_verify/sign-ins-per-active-user.qmd
                  - cookbook/ibm_verify/cumulative-unique-users.qmd
              - section: "Applications"
                contents:
                  - cookbook/ibm_verify/sign-ins-by-application.qmd
                  - cookbook/ibm_verify/sign-in-success-rate-by-application.qmd
                  - cookbook/ibm_verify/peak-daily-unique-users.qmd
                  - cookbook/ibm_verify/cumulative-unique-users-by-application.qmd
                  - cookbook/ibm_verify/applications-per-credential.qmd
                  - cookbook/ibm_verify/average-daily-sign-ins.qmd
              - section: "MFA"
                contents:
                  - cookbook/ibm_verify/mfa-authentications.qmd
                  - cookbook/ibm_verify/mfa-success-rate.qmd
                  - cookbook/ibm_verify/mfa-success-rate-by-factor.qmd
                  - cookbook/ibm_verify/mfa-activity-by-factor.qmd
                  - cookbook/ibm_verify/sign-in-mfa-activity-by-factor.qmd
          - section: "Call Centre"
            href: cookbook/call_centre.qmd
            contents:
              - cookbook/call_centre/calls-accepted.qmd
              - cookbook/call_centre/calls-answered.qmd
              - cookbook/call_centre/average-call-length.qmd
              - cookbook/call_centre/average-delay.qmd
              - cookbook/call_centre/abandonment-rate.qmd
              - cookbook/call_centre/answer-rate.qmd
              - cookbook/call_centre/service-level.qmd
              - cookbook/call_centre/average-handle-time.qmd
              - cookbook/call_centre/calls-per-active-user.qmd
              - cookbook/call_centre/call-topic-share.qmd
              - cookbook/call_centre/top-10-call-topics.qmd
          - section: "Platform"
            href: cookbook/sre.qmd
            contents:
              - cookbook/sre/mean-time-to-resolution.qmd
              - cookbook/sre/site-uptime.qmd
              - cookbook/sre/site-response-time.qmd
              - cookbook/sre/outage-events.qmd
          - section: "Jira (PSOM)"
            href: cookbook/jira.qmd
            contents:
              - cookbook/jira/tickets-by-status.qmd
              - cookbook/jira/weekly-ticket-volume.qmd
              - cookbook/jira/tickets-by-priority.qmd
              - cookbook/jira/sla-first-response-breach-rate.qmd
              - cookbook/jira/sla-time-to-done-breach-rate.qmd
              - cookbook/jira/sla-pso-time-to-done-breach-rate.qmd
          - section: "Google Analytics"
            href: cookbook/google_analytics.qmd
            contents:
              - cookbook/google_analytics/task-success-rate.qmd
          - cookbook/unique-users.qmd
          - cookbook/notes.qmd
#          - cookbook/cross-source.qmd
      - section: "Data Catalog"
        href: catalog/index.qmd
        contents:
          - section: "IBM Verify"
            href: catalog/ibm_verify.qmd
            contents:
              - text: app_login_counts
                href: catalog/ibm_verify/app_login_counts.qmd
              - text: auth_total_logins
                href: catalog/ibm_verify/auth_total_logins.qmd
              - text: mfa_activity
                href: catalog/ibm_verify/mfa_activity.qmd
          - section: "Call Centre"
            href: catalog/call_centre.qmd
            contents:
              - text: weekly_activity_report
                href: catalog/call_centre/weekly_activity_report.qmd
              - text: weekly_topic_dump
                href: catalog/call_centre/weekly_topic_dump.qmd
          - section: "Platform"
            href: catalog/sre.qmd
            contents:
              - text: mttr_current
                href: catalog/sre/mttr_current.qmd
              - text: mttr_history
                href: catalog/sre/mttr_history.qmd
              - text: uptime_summary
                href: catalog/sre/uptime_summary.qmd
              - text: uptime_timeseries
                href: catalog/sre/uptime_timeseries.qmd
          - section: "Jira (PSOM)"
            href: catalog/jira.qmd
            contents:
              - text: psom
                href: catalog/jira/psom.qmd
              - text: psom_sla
                href: catalog/jira/psom_sla.qmd
              - text: psom_comment
                href: catalog/jira/psom_comment.qmd
          - section: "Google Analytics"
            href: catalog/google_analytics.qmd
            contents:
              - text: property_traffic
                href: catalog/google_analytics/property_traffic.qmd
              - text: page_traffic
                href: catalog/google_analytics/page_traffic.qmd
              - text: error_events
                href: catalog/google_analytics/error_events.qmd
              - text: funnels
                href: catalog/google_analytics/funnels.qmd
              - text: funnels_current
                href: catalog/google_analytics/funnels_current.qmd
              - text: funnel_metrics
                href: catalog/google_analytics/funnel_metrics.qmd
              - text: funnel_metrics_current
                href: catalog/google_analytics/funnel_metrics_current.qmd
          - section: "Relying Parties"
            href: catalog/rp.qmd
            contents:
              - text: service
                href: catalog/rp/service.qmd
              - text: alias
                href: catalog/rp/alias.qmd
          - catalog/notes.qmd

format:
  html:
    toc: true
    toc-depth: 4
    toc-location: right
    toc-expand: true
    code-fold: true
    number-sections: false
    theme:
      # Order sets precedence: custom.scss > _brand.yml > cosmo. The brand
      # supplies CDS colours and fonts on top of cosmo; custom.scss keeps the
      # structural overrides (TOC width, bold nav) on top of everything.
      - cosmo
      - brand
      - custom.scss
    # Google Analytics tag. The rationale for every setting is in the file.
    include-in-header: _analytics.html

execute:
  echo: true
  warning: false
  message: false
